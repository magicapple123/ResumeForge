<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="What ResumeForge does: one end-to-end job-hunting pipeline, with the features behind each of its six stages">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96a5"/>
    </marker>
    <filter id="cs" x="-6%" y="-10%" width="112%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      .t { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
      .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .ct { font-size: 15.5px; font-weight: 700; fill: #16365c; }
      .cb { font-size: 12.5px; fill: #55606e; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="539" rx="14" fill="none" stroke="#e3e8ef"/>

  <text class="t" x="30" y="46" font-size="24" font-weight="700" fill="#16365c">What ResumeForge does · one complete job-hunting pipeline</text>
  <text class="t" x="30" y="72" font-size="13.5" fill="#64748b">From reading a job post to landing an offer, every step has a feature behind it — and every output can be traced back</text>

  <!-- 1 -->
  <rect x="30" y="110" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="56" cy="136" r="14" fill="#16365c"/>
  <text class="t" x="56" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text class="t ct" x="80" y="142" >Find and understand jobs</text>
  <text class="t cb" x="48" y="176" >· Paste text, screenshot or pdf/docx</text>
  <text class="t cb" x="48" y="200" >· Paste several, split and confirm</text>
  <text class="t cb" x="48" y="224" >· Auto-collect by keyword and city</text>
  <text class="t cb" x="48" y="248" >· Skill tags extracted on save</text>

  <!-- 2 -->
  <rect x="350" y="110" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="376" cy="136" r="14" fill="#16365c"/>
  <text class="t" x="376" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text class="t ct" x="400" y="142" >Judge the fit</text>
  <text class="t cb" x="368" y="176" >· Five verdicts; the score is display-only</text>
  <text class="t cb" x="368" y="200" >· Each cites the JD text and your evidence</text>
  <text class="t cb" x="368" y="224" >· No evidence? Says "not in your profile"</text>
  <text class="t cb" x="368" y="248" >· Kept apart from JD interpretation</text>

  <!-- 3 -->
  <rect x="670" y="110" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="696" cy="136" r="14" fill="#16365c"/>
  <text class="t" x="696" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text class="t ct" x="720" y="142" >Write a resume that holds</text>
  <text class="t cb" x="688" y="176" >· AI filters facts by JD, streams output</text>
  <text class="t cb" x="688" y="200" >· Write it yourself: STAR, bilingual</text>
  <text class="t cb" x="688" y="224" >· Claim ledger blocks what you never did</text>
  <text class="t cb" x="688" y="248" >· Duplicate, risky words, ATS self-check</text>

  <!-- 4 -->
  <rect x="30" y="300" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="56" cy="326" r="14" fill="#16365c"/>
  <text class="t" x="56" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text class="t ct" x="80" y="332" >Export and deliver</text>
  <text class="t cb" x="48" y="366" >· A4 to PDF / Word / MD / txt / JSON</text>
  <text class="t cb" x="48" y="390" >· Custom watermark, one-click redaction</text>
  <text class="t cb" x="48" y="414" >· Offline pack: read-only, comments</text>
  <text class="t cb" x="48" y="438" >· Version diff, computed locally only</text>

  <!-- 5 -->
  <rect x="350" y="300" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="376" cy="326" r="14" fill="#16365c"/>
  <text class="t" x="376" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text class="t ct" x="400" y="332" >Apply and follow up</text>
  <text class="t cb" x="368" y="366" >· Apply desk and web forms, always manual</text>
  <text class="t cb" x="368" y="390" >· Paste an email or screenshot to log</text>
  <text class="t cb" x="368" y="414" >· Color-coded reminders, referral stats</text>
  <text class="t cb" x="368" y="438" >· Dashboard: conversion, pace, channels</text>

  <!-- 6 -->
  <rect x="670" y="300" width="300" height="160" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#cs)"/>
  <circle cx="696" cy="326" r="14" fill="#16365c"/>
  <text class="t" x="696" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text class="t ct" x="720" y="332" >Interview and review</text>
  <text class="t cb" x="688" y="366" >· Mock interviews probe round by round</text>
  <text class="t cb" x="688" y="390" >· Drills pressure-test the claim ledger</text>
  <text class="t cb" x="688" y="414" >· Criteria fixed before questions appear</text>
  <text class="t cb" x="688" y="438" >· Lessons feed back into the resume</text>

  <!-- In-row arrows -->
  <path d="M 334 190 L 346 190" stroke="#8b96a5" stroke-width="1.4" marker-end="url(#fa)"/>
  <path d="M 654 190 L 666 190" stroke="#8b96a5" stroke-width="1.4" marker-end="url(#fa)"/>
  <path d="M 334 380 L 346 380" stroke="#8b96a5" stroke-width="1.4" marker-end="url(#fa)"/>
  <path d="M 654 380 L 666 380" stroke="#8b96a5" stroke-width="1.4" marker-end="url(#fa)"/>

  <!-- Loop: what review taught you goes back into the resume -->
  <path d="M 820 300 L 820 272" stroke="#8b96a5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text class="t" x="812" y="291" font-size="12" fill="#7b8794" text-anchor="end">Review feeds back into the resume</text>

  <text class="t" x="30" y="506" font-size="12.5" fill="#64748b">All data stays on your machine in a single SQLite file · Free and open source forever, no accounts · Parsing, checks and every export work offline</text>
</svg>
