<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="ResumeForge architecture and data boundaries">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16365c"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96a5"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .t { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="699" rx="14" fill="none" stroke="#e3e8ef"/>

  <!-- Title -->
  <text class="t" x="36" y="50" font-size="24" font-weight="700" fill="#16365c">ResumeForge · architecture and data boundaries</text>
  <text class="t" x="36" y="74" font-size="13.5" fill="#64748b">Front end and back end are separate; the UI only talks to one same-origin /api; business data lives in one SQLite file on your machine</text>

  <!-- Front end -->
  <rect x="36" y="96" width="284" height="306" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#soft)"/>
  <text class="t" x="56" y="126" font-size="17" font-weight="700" fill="#16365c">Browser · React front end</text>
  <line x1="36" y1="140" x2="320" y2="140" stroke="#e2e9f2"/>
  <g class="t" font-size="14" fill="#334155">
    <rect x="52" y="156" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="111" y="179" text-anchor="middle">Job board</text>
    <rect x="186" y="156" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="245" y="179" text-anchor="middle">Resume Center</text>

    <rect x="52" y="200" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="111" y="223" text-anchor="middle">Apply desk</text>
    <rect x="186" y="200" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="245" y="223" text-anchor="middle">Job tracker</text>

    <rect x="52" y="244" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="111" y="267" text-anchor="middle">Web form</text>
    <rect x="186" y="244" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="245" y="267" text-anchor="middle">Mock interview</text>

    <rect x="52" y="288" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="111" y="311" text-anchor="middle">Job assistant</text>
    <rect x="186" y="288" width="118" height="36" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text x="245" y="311" text-anchor="middle">Claim ledger</text>
  </g>
  <text class="t" x="52" y="352" font-size="12.5" fill="#7b8794">Ant Design 6 + TypeScript (strict)</text>
  <text class="t" x="52" y="372" font-size="12.5" fill="#7b8794">No global store; state lives in pages</text>
  <text class="t" x="52" y="392" font-size="12.5" fill="#7b8794">Lazy-loaded routes, 17 entries</text>

  <!-- Connection -->
  <text class="t" x="400" y="178" font-size="13" font-weight="700" fill="#16365c" text-anchor="middle">Same-origin /api</text>
  <line x1="328" y1="206" x2="470" y2="206" stroke="#16365c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t" x="400" y="199" font-size="11" fill="#7b8794" text-anchor="middle">REST requests</text>
  <line x1="472" y1="246" x2="330" y2="246" stroke="#16365c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t" x="400" y="265" font-size="11" fill="#7b8794" text-anchor="middle">SSE streamed replies</text>
  <text class="t" x="400" y="296" font-size="11" fill="#9aa5b1" text-anchor="middle">Vite proxy in dev</text>
  <text class="t" x="400" y="314" font-size="11" fill="#9aa5b1" text-anchor="middle">Reverse proxy in prod</text>

  <!-- Back end -->
  <rect x="480" y="96" width="484" height="306" rx="12" fill="#f7fafd" stroke="#d9e3ef" filter="url(#soft)"/>
  <text class="t" x="500" y="126" font-size="17" font-weight="700" fill="#16365c">FastAPI back end</text>
  <text class="t" x="500" y="146" font-size="12" fill="#7b8794">Router → service → data access</text>
  <line x1="480" y1="160" x2="964" y2="160" stroke="#e2e9f2"/>

  <g>
    <rect x="496" y="172" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="508" y="196" font-size="13.5" font-weight="700" fill="#16365c">Job / JD parsing</text>
    <text class="t" x="508" y="216" font-size="11.5" fill="#64748b">Rule-based, no model call</text>
    <text class="t" x="508" y="232" font-size="11.5" fill="#64748b">Works offline</text>

    <rect x="726" y="172" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="738" y="196" font-size="13.5" font-weight="700" fill="#16365c">Resume build &amp; render</text>
    <text class="t" x="738" y="216" font-size="11.5" fill="#64748b">Jinja2 templates, 6 presets</text>
    <text class="t" x="738" y="232" font-size="11.5" fill="#64748b">Layout checks, auto one page</text>

    <rect x="496" y="250" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="508" y="274" font-size="13.5" font-weight="700" fill="#16365c">Multi-format export</text>
    <text class="t" x="508" y="294" font-size="11.5" fill="#64748b">HTML / PDF / docx</text>
    <text class="t" x="508" y="310" font-size="11.5" fill="#64748b">Markdown / txt / JSON</text>

    <rect x="726" y="250" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="738" y="274" font-size="13.5" font-weight="700" fill="#16365c">Match &amp; risk checks</text>
    <text class="t" x="738" y="294" font-size="11.5" fill="#64748b">Five verdicts, local rules</text>
    <text class="t" x="738" y="310" font-size="11.5" fill="#64748b">No percentages; score display-only</text>

    <rect x="496" y="328" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="508" y="352" font-size="13.5" font-weight="700" fill="#16365c">Job assistant</text>
    <text class="t" x="508" y="372" font-size="11.5" fill="#64748b">Tool calls + SSE streaming</text>
    <text class="t" x="508" y="388" font-size="11.5" fill="#64748b">Capability map at runtime</text>

    <rect x="726" y="328" width="222" height="72" rx="8" fill="#ffffff" stroke="#cfdcec"/>
    <text class="t" x="738" y="352" font-size="13.5" font-weight="700" fill="#16365c">Apply desk · web form</text>
    <text class="t" x="738" y="372" font-size="11.5" fill="#64748b">CDP drives your own browser</text>
    <text class="t" x="738" y="388" font-size="11.5" fill="#64748b">Only ever started by you</text>
  </g>

  <!-- Landing: bus -->
  <line x1="620" y1="402" x2="620" y2="420" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <line x1="184" y1="420" x2="816" y2="420" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="184" y1="420" x2="184" y2="434" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <line x1="500" y1="420" x2="500" y2="434" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <line x1="816" y1="420" x2="816" y2="434" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>

  <!-- Three landing blocks -->
  <rect x="36" y="436" width="296" height="164" rx="12" fill="#f8fdfb" stroke="#c9e6dc" filter="url(#soft)"/>
  <text class="t" x="52" y="466" font-size="15.5" font-weight="700" fill="#0f766e">SQLite · one local file</text>
  <text class="t" x="52" y="492" font-size="12" fill="#5b6b7a">Jobs · profile · resumes · ledger</text>
  <text class="t" x="52" y="511" font-size="12" fill="#5b6b7a">Assistant history, files and photos</text>
  <text class="t" x="52" y="530" font-size="12" fill="#5b6b7a">Export, render and PDF all run locally</text>
  <rect x="52" y="548" width="122" height="28" rx="14" fill="#e6f4ef" stroke="#b9dfd3"/>
  <text class="t" x="113" y="567" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">Offline by default</text>

  <rect x="352" y="436" width="296" height="164" rx="12" fill="#fffbf5" stroke="#f0dcbc" filter="url(#soft)"/>
  <text class="t" x="368" y="466" font-size="15.5" font-weight="700" fill="#b45309">Model providers you configure</text>
  <text class="t" x="368" y="492" font-size="12" fill="#6b7280">OpenAI-compatible / Anthropic native</text>
  <text class="t" x="368" y="511" font-size="12" fill="#6b7280">Only the minimum data this run needs</text>
  <text class="t" x="368" y="530" font-size="12" fill="#6b7280">Photos are never sent to models</text>
  <rect x="368" y="548" width="166" height="28" rx="14" fill="#fdf1dd" stroke="#eccfa0"/>
  <text class="t" x="451" y="567" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">May go online · you opt in</text>

  <rect x="668" y="436" width="296" height="164" rx="12" fill="#fffbf5" stroke="#f0dcbc" filter="url(#soft)"/>
  <text class="t" x="684" y="466" font-size="15.5" font-weight="700" fill="#b45309">Your local Chrome / Edge</text>
  <text class="t" x="684" y="492" font-size="12" fill="#6b7280">Used by Apply desk and web form, over CDP</text>
  <text class="t" x="684" y="511" font-size="12" fill="#6b7280">You sign in inside your own browser</text>
  <text class="t" x="684" y="530" font-size="12" fill="#6b7280">No passwords, cookies or tokens</text>
  <rect x="684" y="548" width="166" height="28" rx="14" fill="#fdf1dd" stroke="#eccfa0"/>
  <text class="t" x="767" y="567" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">May go online · one click</text>

  <!-- Legend -->
  <line x1="36" y1="640" x2="66" y2="640" stroke="#16365c" stroke-width="1.6"/>
  <text class="t" x="74" y="644" font-size="12" fill="#64748b">In-process, stays local</text>
  <line x1="240" y1="640" x2="270" y2="640" stroke="#8b96a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="t" x="278" y="644" font-size="12" fill="#64748b">May go online, only when you start it</text>
  <text class="t" x="36" y="672" font-size="12" fill="#64748b">No hard-coded keys · No job-site credentials stored · Single-user local tool listening on loopback only; never expose it</text>
</svg>
