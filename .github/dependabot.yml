version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      # TypeScript 7 (Go-native compiler) is outside typescript-eslint
      # 8.71.0's peer range (>=4.8.4 <6.1.0) — npm ci fails with ERESOLVE
      # (#55). Remove this ignore once typescript-eslint announces TS 7
      # support. (2026-10-02)
      - dependency-name: typescript
        versions: [">=7"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
