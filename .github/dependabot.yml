version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # fonttools 4.66+ requires Python >=3.11, but this repo still
      # supports Python 3.10. Remove this ignore once the Python floor
      # rises to 3.11. (2026-10-02)
      - dependency-name: fonttools
        versions: [">=4.66"]
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
      # sqlalchemy 2.1.x requires Python >=3.11 (repo supports 3.10), and
      # 2.1 URL.render_as_string() percent-encodes paths, which breaks
      # alembic configparser interpolation in database_migrations.py.
      # Re-evaluate after the Python floor rises to 3.11. (2026-10-02)
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      # React 19 upgrade is deferred until the antd 6 migration lands
      # (antd 5 needs a compatibility patch for React 19). Remove this
      # ignore block once antd 6 + React 19 work is done. (2026-10-02)
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
