                    </g>
                    <g transform="translate(235 385) rotate(12)">
                      <rect width="95" height="13" rx="6.5" class="ii-dark-layer ii-dark-row" style="--ii-dark-delay:900ms" />
                    </g>
                  </g>
                  <rect width="81" height="18" rx="6" transform="translate(361 142) rotate(7) skewX(-15)" fill="url(#ii-dark-pill-fill)" stroke="#F5953D" class="ii-dark-layer ii-dark-pill" />
                </g>
              </g>
