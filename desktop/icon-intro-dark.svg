      <stop offset="1" stop-color="#FDA349" />
    </linearGradient>
    <linearGradient id="ii-dark-crescent-fill" x1="12%" y1="0" x2="82%" y2="100%">
      <stop stop-color="#FFF6D9" />
      <stop offset=".54" stop-color="#FCE2A5" />
