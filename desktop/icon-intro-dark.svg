    </linearGradient>
    <radialGradient id="ii-dark-halo-fill">
      <stop stop-color="#FFE3A1" stop-opacity=".43" />
      <stop offset=".58" stop-color="#F2C675" stop-opacity=".16" />
      <stop offset="1" stop-color="#E59A50" stop-opacity="0" />
    </radialGradient>
    <filter id="ii-dark-cover-shadow" x="-24%" y="-24%" width="150%" height="157%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-1" dy="23" stdDeviation="22" flood-color="#080F1A" flood-opacity=".24" />
    </filter>
    <filter id="ii-dark-book-shadow" x="-16%" y="-16%" width="135%" height="139%" color-interpolation-filters="sRGB">
      <feDropShadow dx="1" dy="6" stdDeviation="11" flood-color="#080F1A" flood-opacity=".19" />
    </filter>
    <clipPath id="ii-dark-safe">
      <rect x="32" y="32" width="448" height="448" />
    </clipPath>
    <clipPath id="ii-dark-plate-clip">
      <rect width="512" height="512" rx="57" />
    </clipPath>
    <clipPath id="ii-dark-left-leaf">
      <path d="M326 100 C289 79 223 57 194 46 C183 42 173 47 168 59 C135 144 87 246 35 335 C29 346 34 356 43 360 C98 384 149 395 186 431 C237 337 291 211 326 100 Z" class="ii-dark-layer ii-dark-left-clip" />
    </clipPath>
    <clipPath id="ii-dark-right-leaf">
      <path d="M326 100 C379 107 431 111 464 116 C476 118 482 128 478 139 C437 245 388 355 335 454 C330 464 320 469 310 466 C268 455 221 440 186 431 C237 337 291 211 326 100 Z" class="ii-dark-layer ii-dark-right-clip" />
    </clipPath>
    <path id="ii-dark-crescent-shape" d="M279 181 C249 175 220 191 207 219 C193 249 206 281 234 294                      C264 308 298 297 315 269 Q317 266 313 268                      C289 276 265 265 253 246 C240 225 250 197 279 183 Q282 182 279 181 Z" />
  </defs>
